[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-bench"
version = "0.4.0"
description = "Reproducible benchmarks for sparse attention kernels (fictional example; replays a recorded demo run)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
spark-bench = "spark_bench.cli:main"

[tool.setuptools]
packages = ["spark_bench"]
